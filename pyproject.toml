[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tadbench"
version = "0.1.0"
description = "A Unified Benchmark for Embedding-Based Threat Detection in LLM Prompts"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
dependencies = [
    "sentence-transformers>=4.0",
    "faiss-cpu>=1.7",
    "scikit-learn>=1.4",
    "datasets>=2.0",
    "transformers>=4.40,<5",
    "nltk>=3.8",
    "psutil>=5.9",
    "click>=8.0",
    "tqdm>=4.60",
    "numpy<2",
    # pyarrow 26 (pulled in by datasets) requires numpy>=2
    "pyarrow<26",
    "pandas",
    "h5py",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[project.scripts]
tadbench = "tadbench.cli:cli"

[tool.setuptools.packages.find]
include = ["tadbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
